name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unitários, ArchUnit, integração e E2E (Testcontainers usa o Docker do runner).
      - run: ./mvnw -B verify
      - name: Validar a imagem Docker
        run: docker build -t library-api:ci .

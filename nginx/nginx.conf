# O DNS interno do Docker devolve uma entrada por réplica de "api".
# A variável força uma nova resolução, então réplicas novas entram no balanceamento sem reiniciar o Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    charset utf-8;
    client_max_body_size 2m;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        # Mostra qual réplica atendeu, para demonstrar o balanceamento.
        add_header X-Served-By $upstream_addr always;
    }
}
